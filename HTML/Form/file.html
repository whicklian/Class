<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="#" method="post">
      <input type="file" id="file-upload" hidden />
      <label for="file-upload" class="upload-btn">Upload File</label>

      <select name="filetype" id="filetype">
        <option value="pdf">IT</option>
        <option value="docx">SIK</option>
        <option value="txt" selected>COM</option>
        <option value="jpg">BIT</option>
        <option value="png">ETS</option>
      </select>
    </form>
  </body>
</html>
